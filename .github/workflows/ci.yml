name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  go-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify Go modules are tidy
        run: |
          go mod tidy
          if ! git diff -w --exit-code go.mod go.sum; then
            echo "::error::Go modules are not tidy! Please run 'go mod tidy' locally."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Enforce cache and internal coverage
        run: |
          failed=0
          for pkg in ./cache ./internal; do
            go test -race -covermode=atomic -coverprofile=cover.out "$pkg" >/dev/null
            pct=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
            echo "$pkg: ${pct}%"
            if ! awk -v p="$pct" 'BEGIN { exit (p < 80) ? 1 : 0 }'; then
              echo "::error::$pkg coverage ${pct}% is below the 80% threshold"
              failed=1
            fi
          done
          exit "$failed"

      - name: Build example modules
        run: |
          (cd _examples/cache/otp_code_verification && go build ./...)
          (cd _examples/idempotency && go build ./...)
